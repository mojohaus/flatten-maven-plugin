version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    exclude-paths:
      - "src/it/**"
      - "src/test/resources/**"
    schedule:
      interval: "daily"
    ignore:
      # plexus-xml 4.x is the Maven 4 line (depends on maven-xml-impl 4.0.0-alpha)
      - dependency-name: "org.codehaus.plexus:plexus-xml"
        versions: [">= 4.0.0"]
      # Maven 3.9.x core exports slf4j-api 1.7.36
      - dependency-name: "org.slf4j:*"
        versions: [">= 2.0.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
